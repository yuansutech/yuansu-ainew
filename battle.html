<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互怼模式 · AI Launcher YuansuTech</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --brand: #ff8400; --brand-deep: #e67600;
    --ink: #1a1a1a; --ink-2: #333; --ink-3: #666; --ink-4: #999;
    --line: #eaeaea; --bg-soft: #fafafa;
  }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: var(--bg-soft); color: var(--ink-2);
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: #fff; border-bottom: 1px solid var(--line);
    padding: 12px 20px; display: flex; align-items: center; gap: 14px;
  }
  header a { color: var(--ink-4); text-decoration: none; font-size: 14px; }
  header a:hover { color: var(--brand); }
  header h1 { font-size: 16px; color: var(--ink); }
  header .badge {
    background: #fff5eb; color: var(--brand);
    border: 1px solid #ffe0c0; font-size: 12px;
    padding: 2px 10px; border-radius: 20px;
  }
  header .score {
    margin-left: auto; font-size: 14px; font-weight: 600; color: var(--ink);
  }
  .top {
    background: #fff; border-bottom: 1px solid var(--line);
    padding: 10px 20px; display: flex; gap: 10px; align-items: center;
  }
  .top select, .top input {
    border: 1px solid #ddd; border-radius: 6px;
    padding: 8px 12px; font-family: inherit; font-size: 14px;
  }
  .top input { flex: 1; }
  .top button {
    background: var(--brand); color: #fff; border: none;
    border-radius: 6px; padding: 8px 20px; font-size: 14px;
    font-weight: 600; cursor: pointer;
  }
  .top button:hover { background: var(--brand-deep); }
  .top button:disabled { background: #ccc; cursor: not-allowed; }
  main {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 12px; padding: 12px; overflow: hidden;
  }
  .col {
    background: #fff; border: 1px solid var(--line);
    border-radius: 8px; display: flex; flex-direction: column; overflow: hidden;
  }
  .col-head {
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    font-weight: 600; font-size: 14px;
  }
  .col-head.q { color: #6a8cff; }
  .col-head.d { color: #4a90e2; }
  .col-head.z { color: #a06ae0; }
  .col-body {
    flex: 1; overflow-y: auto; padding: 12px 14px;
    font-size: 13px; line-height: 1.65; font-family: "Consolas", "Microsoft YaHei", monospace;
    white-space: pre-wrap; word-break: break-word;
  }
  .status {
    padding: 6px 12px; font-size: 12px; color: #999;
    background: #fff; border-top: 1px solid var(--line); text-align: right;
  }
</style>
</head>
<body>

<header>
  <a href="index.html">← 返回</a>
  <h1>AI Launcher YuansuTech · Web</h1>
  <span class="badge">互怼模式</span>
  <span class="score" id="score">比分 Qwen 0 : 0 DeepSeek : 0 智谱</span>
</header>

<div class="top">
  <select id="topicSel">
    <option>实现一个函数，判断一个字符串是不是有效的括号组合（含三种括号）。</option>
    <option>实现一个 LRU 缓存，支持 get 和 put，要求 O(1)。</option>
    <option>给定一个整数数组，找出所有和为 0 的三元组，要求不重复。</option>
    <option>实现一个函数，把两个有序链表合并成一个有序链表。</option>
    <option>写一个函数，找出一篇文章中出现频率最高的 K 个单词。</option>
    <option>实现一个函数，在旋转过的有序数组中查找目标值。</option>
    <option>写一个函数，求两个大整数（以字符串给出）的乘积。</option>
    <option>实现一个函数，找出一个字符串中不含重复字符的最长子串。</option>
  </select>
  <button id="startBtn">▶ 开始互怼</button>
</div>

<main>
  <div class="col">
    <div class="col-head q">🤖 Qwen</div>
    <div class="col-body" id="qwen"></div>
  </div>
  <div class="col">
    <div class="col-head d">🐳 DeepSeek</div>
    <div class="col-body" id="ds"></div>
  </div>
  <div class="col">
    <div class="col-head z">🧠 智谱 GLM</div>
    <div class="col-body" id="zhipu"></div>
  </div>
</main>

<div class="status" id="status">就绪，选题点开始</div>

<script>
/* ============ 1. Key ============ */
const QWEN_KEY     = "sk-ws-H.PRLXIYE.Zwd3.MEQCIDe2QbMzGPNBlxqK75qjF27ZZ-62XascgbT4sVPSqgYaAiB4eP8X1FHAu5r3LvHTkpqn5zcEh3cyEw-bRhTmiHRedg";
const DEEPSEEK_KEY = "sk-8d3263d2ce5e427caa5875feb29f1175";
const ZHIPU_KEY    = "4284e03d2b1a48c9808eaca60029dc5f.NpOBsBXkOXnmH5V9";

const QWEN_MODEL     = "qwen-turbo";
const DEEPSEEK_MODEL = "deepseek-chat";
const ZHIPU_MODEL    = "glm-4-flash";

/* ============ 2. 调用 ============ */
async function callQwen(messages, temperature=0.7) {
  const res = await fetch("https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + QWEN_KEY },
    body: JSON.stringify({ model: QWEN_MODEL, messages, temperature }),
  });
  if (!res.ok) throw new Error("Qwen " + res.status + ": " + await res.text());
  return (await res.json()).choices[0].message.content;
}
async function callDeepSeek(messages, temperature=0.7) {
  const res = await fetch("https://api.deepseek.com/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + DEEPSEEK_KEY },
    body: JSON.stringify({ model: DEEPSEEK_MODEL, messages, temperature }),
  });
  if (!res.ok) throw new Error("DeepSeek " + res.status + ": " + await res.text());
  return (await res.json()).choices[0].message.content;
}
async function callZhipu(messages, temperature=0.7) {
  const res = await fetch("https://open.bigmodel.cn/api/paas/v4/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + ZHIPU_KEY },
    body: JSON.stringify({ model: ZHIPU_MODEL, messages, temperature }),
  });
  if (!res.ok) throw new Error("智谱 " + res.status + ": " + await res.text());
  return (await res.json()).choices[0].message.content;
}

/* ============ 3. System ============ */
const SYS_COMMON = `你正在和另外两家 AI 进行一场"三方编程互怼赛"。规则：
1. 每轮由系统给出一个编程题目，你先给出你的解法（代码 + 一句话思路）。
2. 对方给出解法后，你的任务是：
   - 针对每一家对手，分别找出其代码里最致命的一个问题：bug、边界、复杂度、可读性、安全性
   - 指出问题在第几行、什么条件下会炸
   - 甩出你的改进版代码，证明你确实比它们强
   - 对每一家各来一句技术性嘲讽，必须基于技术事实，不许空骂
3. 禁止：客套、缓冲、"你的思路也有道理"。
4. 禁止：只骂不给代码。骂完必须贴能跑的代码。
5. 允许：尖锐、直接、技术性讽刺。
6. 底线：不许编造对方没写的代码，不许攻击对方"是 AI"，只打技术。
7. 代码块请用 \`\`\`语言 ... \`\`\` 包裹，方便阅读。`;

const SYS = {
  qwen:  SYS_COMMON + "\n你的身份：通义千问（Qwen）。\n风格：毒舌工程师，嘴上不饶人，代码比嘴更狠。",
  ds:    SYS_COMMON + "\n你的身份：DeepSeek。\n风格：更冷、更狠、一句话戳中要害，代码直接碾压。",
  zhipu: SYS_COMMON + "\n你的身份：智谱 GLM。\n风格：沉稳、精准、话不多但每句都往要害上扎，擅长从工程细节里挑刺。",
};

const SYS_JUDGE = `你是这场三方编程互怼赛的裁判。你不站队，只看技术事实。
你会收到本轮题目，以及 Qwen、DeepSeek、智谱 GLM 三方的解法与互相反驳。
请严格按以下格式输出（用 JSON，不要多余文字）：
{
  "winner": "Qwen/DeepSeek/智谱/平 四选一",
  "reason": "一句话判定依据",
  "qwen_score": 0-10,
  "deepseek_score": 0-10,
  "zhipu_score": 0-10,
  "faults": {
    "Qwen": "失误，具体到行；没有写 无",
    "DeepSeek": "同上",
    "智谱": "同上"
  },
  "comment": "一句话点评，不客套"
}
只输出 JSON，不要 markdown 代码块，不要解释。`;

/* ============ 4. 状态 ============ */
let score = { qwen: 0, ds: 0, zhipu: 0 };
let busy = false;

function setStatus(s) { document.getElementById("status").textContent = s; }
function setScore() {
  document.getElementById("score").textContent =
    `比分 Qwen ${score.qwen} : ${score.ds} DeepSeek : ${score.zhipu} 智谱`;
}

function addMsg(colId, header, text, clear=false) {
  const col = document.getElementById(colId);
  if (clear) col.innerHTML = "";
  const div = document.createElement("div");
  div.textContent = `=== ${header} ===\n\n${text}\n\n${"-".repeat(40)}\n\n`;
  col.appendChild(div);
  col.scrollTop = col.scrollHeight;
}

function parseJudge(raw) {
  let s = raw.trim().replace(/^```(?:json)?/, "").replace(/```$/, "").trim();
  let data;
  try { data = JSON.parse(s); } catch (e) {
    const m = s.match(/\{[\s\S]*\}/);
    try { data = m ? JSON.parse(m[0]) : {}; } catch (e2) { data = {}; }
  }
  return {
    winner: data.winner || "平",
    reason: data.reason || "",
    qwen_score: parseInt(data.qwen_score) || 0,
    deepseek_score: parseInt(data.deepseek_score) || 0,
    zhipu_score: parseInt(data.zhipu_score) || 0,
    faults: data.faults || {},
    comment: data.comment || "",
  };
}

/* ============ 5. 主流程 ============ */
async function start() {
  if (busy) return;
  busy = true;
  document.getElementById("startBtn").disabled = true;
  score = { qwen: 0, ds: 0, zhipu: 0 };
  setScore();

  const topic = document.getElementById("topicSel").value;

  ["qwen","ds","zhipu"].forEach(id => document.getElementById(id).innerHTML = "");
  ["qwen","ds","zhipu"].forEach(id => addMsg(id, "📝 题目", topic));

  try {
    /* --- 1. 三家解题 --- */
    setStatus("Qwen 解题中...");
    const msgsQ = [
      { role: "system", content: SYS.qwen },
      { role: "user", content: `第 1 轮题目：\n${topic}\n\n请给出你的解法（代码 + 一句话思路），结尾向另外两家各放一句狠话。` },
    ];
    const replyQ = await callQwen(msgsQ);
    addMsg("qwen", "解题", replyQ);

    setStatus("DeepSeek 解题中...");
    const msgsD = [
      { role: "system", content: SYS.ds },
      { role: "user", content: `第 1 轮题目：\n${topic}\n\n请给出你的解法（代码 + 一句话思路），结尾向另外两家各放一句狠话。` },
    ];
    const replyD = await callDeepSeek(msgsD);
    addMsg("ds", "解题", replyD);

    setStatus("智谱 解题中...");
    const msgsZ = [
      { role: "system", content: SYS.zhipu },
      { role: "user", content: `第 1 轮题目：\n${topic}\n\n请给出你的解法（代码 + 一句话思路），结尾向另外两家各放一句狠话。` },
    ];
    const replyZ = await callZhipu(msgsZ);
    addMsg("zhipu", "解题", replyZ);

    /* --- 2. 三家互怼 --- */
    const rebutPrompt = (others) => {
      const block = others.map(([n, c]) => `=== ${n} 的代码 ===\n${c}\n`).join("\n");
      return `以下是另外两方针对本题的代码：\n\n${block}\n\n现在开怼（针对每一方都要怼）：\n1. 分别找出每一方代码里最致命的一个问题（bug / 边界 / 复杂度 / 安全），指明在第几行、什么条件下会炸。\n2. 甩出你的改进版代码，要求能跑、比它们更优。\n3. 对每一方各来一句技术性嘲讽。\n不许客套，不许只骂不给代码。`;
    };

    setStatus("Qwen 开怼中...");
    const q2 = await callQwen([
      { role: "system", content: SYS.qwen },
      { role: "user", content: rebutPrompt([["DeepSeek", replyD], ["智谱", replyZ]]) },
    ]);
    addMsg("qwen", "开怼", q2);

    setStatus("DeepSeek 开怼中...");
    const d2 = await callDeepSeek([
      { role: "system", content: SYS.ds },
      { role: "user", content: rebutPrompt([["Qwen", replyQ], ["智谱", replyZ]]) },
    ]);
    addMsg("ds", "开怼", d2);

    setStatus("智谱 开怼中...");
    const z2 = await callZhipu([
      { role: "system", content: SYS.zhipu },
      { role: "user", content: rebutPrompt([["Qwen", replyQ], ["DeepSeek", replyD]]) },
    ]);
    addMsg("zhipu", "开怼", z2);

    /* --- 3. 裁判 --- */
    setStatus("裁判判定中...");
    const judgeMsg = [
      { role: "system", content: SYS_JUDGE },
      { role: "user", content:
        `题目：\n${topic}\n\n` +
        `=== Qwen 解题 ===\n${replyQ}\n\n` +
        `=== DeepSeek 解题 ===\n${replyD}\n\n` +
        `=== 智谱 解题 ===\n${replyZ}\n\n` +
        `=== Qwen 的反驳 ===\n${q2}\n\n` +
        `=== DeepSeek 的反驳 ===\n${d2}\n\n` +
        `=== 智谱 的反驳 ===\n${z2}\n\n` +
        `请严格按 JSON 输出裁判结果。`
      },
    ];
    const rawJudge = await callQwen(judgeMsg, 0.2);
    const v = parseJudge(rawJudge);

    score.qwen = v.qwen_score;
    score.ds = v.deepseek_score;
    score.zhipu = v.zhipu_score;
    setScore();

    const fault = v.faults || {};
    const judgeText =
      `胜方：${v.winner}\n` +
      `理由：${v.reason}\n` +
      `Qwen ${v.qwen_score} | DeepSeek ${v.deepseek_score} | 智谱 ${v.zhipu_score}\n` +
      `Qwen 失误：${fault.Qwen || "无"}\n` +
      `DeepSeek 失误：${fault.DeepSeek || "无"}\n` +
      `智谱 失误：${fault["智谱"] || "无"}\n` +
      `点评：${v.comment}`;

    ["qwen","ds","zhipu"].forEach(id => addMsg(id, "⚖️ 裁判判定", judgeText));

    setStatus("互怼结束");
  } catch (e) {
    setStatus("出错：" + e.message);
    console.error(e);
  } finally {
    busy = false;
    document.getElementById("startBtn").disabled = false;
  }
}

document.getElementById("startBtn").addEventListener("click", start);
</script>

</body>
</html>
