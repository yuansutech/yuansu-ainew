<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接龙模式 · AI Launcher YuansuTech</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --brand: #ff8400; --brand-deep: #e67600;
    --ink: #1a1a1a; --ink-2: #333; --ink-3: #666; --ink-4: #999;
    --line: #eaeaea; --bg-soft: #fafafa;
  }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: var(--bg-soft); color: var(--ink-2);
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: #fff; border-bottom: 1px solid var(--line);
    padding: 12px 20px; display: flex; align-items: center; gap: 14px;
  }
  header a { color: var(--ink-4); text-decoration: none; font-size: 14px; }
  header a:hover { color: var(--brand); }
  header h1 { font-size: 16px; color: var(--ink); }
  header .badge {
    background: #fff5eb; color: var(--brand);
    border: 1px solid #ffe0c0; font-size: 12px;
    padding: 2px 10px; border-radius: 20px;
  }
  main {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 12px; padding: 12px; overflow: hidden;
  }
  .col {
    background: #fff; border: 1px solid var(--line);
    border-radius: 8px; display: flex; flex-direction: column; overflow: hidden;
  }
  .col-head {
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    font-weight: 600; font-size: 14px;
  }
  .col-head.q { color: #6a8cff; }
  .col-head.d { color: #4a90e2; }
  .col-head.z { color: #a06ae0; }
  .col-body {
    flex: 1; overflow-y: auto; padding: 12px 14px;
    font-size: 13.5px; line-height: 1.7;
  }
  .msg { margin-bottom: 14px; }
  .msg .who { font-size: 11px; color: #999; margin-bottom: 4px; }
  .msg .txt { white-space: pre-wrap; word-break: break-word; }
  .msg.user .who { color: #1a6dff; }
  .msg.user .txt { color: #1a6dff; }
  footer {
    background: #fff; border-top: 1px solid var(--line);
    padding: 12px; display: flex; gap: 10px;
  }
  footer textarea {
    flex: 1; border: 1px solid #ddd; border-radius: 6px;
    padding: 10px; font-family: inherit; font-size: 14px;
    resize: none; height: 60px;
  }
  footer button {
    background: var(--brand); color: #fff; border: none;
    border-radius: 6px; padding: 0 24px; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: background .2s;
  }
  footer button:hover { background: var(--brand-deep); }
  footer button:disabled { background: #ccc; cursor: not-allowed; }
  .status {
    padding: 6px 12px; font-size: 12px; color: #999;
    background: #fff; border-top: 1px solid var(--line); text-align: right;
  }
</style>
</head>
<body>

<header>
  <a href="index.html">← 返回</a>
  <h1>AI Launcher YuansuTech · Web</h1>
  <span class="badge">接龙模式</span>
</header>

<main>
  <div class="col">
    <div class="col-head q">🤖 Qwen</div>
    <div class="col-body" id="qwen"></div>
  </div>
  <div class="col">
    <div class="col-head d">🐳 DeepSeek</div>
    <div class="col-body" id="ds"></div>
  </div>
  <div class="col">
    <div class="col-head z">🧠 智谱 GLM</div>
    <div class="col-body" id="zhipu"></div>
  </div>
</main>

<div class="status" id="status">就绪</div>

<footer>
  <textarea id="input" placeholder="说点什么…（Ctrl+Enter 发送）"></textarea>
  <button id="send">发送</button>
</footer>

<script>
/* ============ 1. 填你的 Key ============ */
const QWEN_KEY     = "sk-ws-H.PRLXIYE.Zwd3.MEQCIDe2QbMzGPNBlxqK75qjF27ZZ-62XascgbT4sVPSqgYaAiB4eP8X1FHAu5r3LvHTkpqn5zcEh3cyEw-bRhTmiHRedg";
const DEEPSEEK_KEY = "sk-8d3263d2ce5e427caa5875feb29f1175";
const ZHIPU_KEY    = "4284e03d2b1a48c9808eaca60029dc5f.NpOBsBXkOXnmH5V9";

const QWEN_MODEL     = "qwen-turbo";
const DEEPSEEK_MODEL = "deepseek-chat";
const ZHIPU_MODEL    = "glm-4-flash";

/* ============ 2. 调用封装 ============ */
async function callQwen(messages) {
  const res = await fetch("https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + QWEN_KEY,
    },
    body: JSON.stringify({ model: QWEN_MODEL, messages, temperature: 0.8 }),
  });
  if (!res.ok) throw new Error("Qwen " + res.status + ": " + await res.text());
  const data = await res.json();
  return data.choices[0].message.content;
}

async function callDeepSeek(messages) {
  const res = await fetch("https://api.deepseek.com/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + DEEPSEEK_KEY,
    },
    body: JSON.stringify({ model: DEEPSEEK_MODEL, messages, temperature: 0.8 }),
  });
  if (!res.ok) throw new Error("DeepSeek " + res.status + ": " + await res.text());
  const data = await res.json();
  return data.choices[0].message.content;
}

async function callZhipu(messages) {
  const res = await fetch("https://open.bigmodel.cn/api/paas/v4/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + ZHIPU_KEY,
    },
    body: JSON.stringify({ model: ZHIPU_MODEL, messages, temperature: 0.8 }),
  });
  if (!res.ok) throw new Error("智谱 " + res.status + ": " + await res.text());
  const data = await res.json();
  return data.choices[0].message.content;
}

/* ============ 3. System Prompt ============ */
const SYS = {
  qwen: "你正在参加一场三人接龙聊天。用户先说话，然后 Qwen → DeepSeek → 智谱 依次接话。你是 Qwen，第一个发言。可以回应前面的人，不要复述，不要总结全场。150 字以内，自然口语，不许客套。",
  ds:   "你正在参加一场三人接龙聊天。用户先说话，然后 Qwen → DeepSeek → 智谱 依次接话。你是 DeepSeek，第二个发言，前面 Qwen 已经说过。可以接话、补充、反驳，不要复述，不要总结全场。150 字以内，自然口语，不许客套。",
  zhipu:"你正在参加一场三人接龙聊天。用户先说话，然后 Qwen → DeepSeek → 智谱 依次接话。你是智谱 GLM，最后一个发言，前面 Qwen 和 DeepSeek 都说过。可以收尾、翻盘，不要复述，不要总结全场。150 字以内，自然口语，不许客套。",
};

/* ============ 4. 三家独立历史 ============ */
const H = {
  qwen:  [{ role: "system", content: SYS.qwen }],
  ds:    [{ role: "system", content: SYS.ds }],
  zhipu: [{ role: "system", content: SYS.zhipu }],
};

function push(who, text) {
  H.qwen.push({ role: "user", content: `[${who} 说] ${text}` });
  H.ds.push({ role: "user", content: `[${who} 说] ${text}` });
  H.zhipu.push({ role: "user", content: `[${who} 说] ${text}` });
}

/* ============ 5. 渲染 ============ */
function addMsg(colId, who, text, isUser) {
  const col = document.getElementById(colId);
  const div = document.createElement("div");
  div.className = "msg" + (isUser ? " user" : "");
  div.innerHTML = `<div class="who">${who}</div><div class="txt"></div>`;
  div.querySelector(".txt").textContent = text;
  col.appendChild(div);
  col.scrollTop = col.scrollHeight;
}

function setStatus(s) {
  document.getElementById("status").textContent = s;
}

/* ============ 6. 主流程 ============ */
let busy = false;

async function send() {
  if (busy) return;
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";

  busy = true;
  document.getElementById("send").disabled = true;

  ["qwen","ds","zhipu"].forEach(id => addMsg(id, "你", text, true));
  push("你", text);

  try {
    setStatus("Qwen 正在说...");
    const r1 = await callQwen(H.qwen);
    H.qwen.push({ role: "assistant", content: r1 });
    H.ds.push({ role: "user", content: `[Qwen 说] ${r1}` });
    H.zhipu.push({ role: "user", content: `[Qwen 说] ${r1}` });
    addMsg("qwen", "Qwen", r1, false);

    setStatus("DeepSeek 正在说...");
    const r2 = await callDeepSeek(H.ds);
    H.ds.push({ role: "assistant", content: r2 });
    H.qwen.push({ role: "user", content: `[DeepSeek 说] ${r2}` });
    H.zhipu.push({ role: "user", content: `[DeepSeek 说] ${r2}` });
    addMsg("ds", "DeepSeek", r2, false);

    setStatus("智谱 正在说...");
    const r3 = await callZhipu(H.zhipu);
    H.zhipu.push({ role: "assistant", content: r3 });
    H.qwen.push({ role: "user", content: `[智谱 说] ${r3}` });
    H.ds.push({ role: "user", content: `[智谱 说] ${r3}` });
    addMsg("zhipu", "智谱", r3, false);

    setStatus("就绪");
  } catch (e) {
    setStatus("出错：" + e.message);
    console.error(e);
  } finally {
    busy = false;
    document.getElementById("send").disabled = false;
  }
}

document.getElementById("send").addEventListener("click", send);
document.getElementById("input").addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.key === "Enter") send();
});
</script>

</body>
</html>
